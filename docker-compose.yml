# KeyVault Store - full production stack (Postgres + Redis + API + Web + Admin)
#   docker compose up -d --build
# Secrets come from backend/.env (env_file); DB/Redis hosts are overridden below.
# Change POSTGRES_PASSWORD before any real deployment.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keyvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-d2bc51ce4eabb6f64889036b8d260644}
      POSTGRES_DB: keyvault
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keyvault -d keyvault']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # LRU eviction: cache keys drop first under memory pressure; BullMQ data
    # lives in Redis too, so persistence (AOF) is on for queue safety.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Inside the compose network, localhost means the container itself —
      # point DB/Redis at the service names instead.
      DATABASE_URL: postgresql://keyvault:${POSTGRES_PASSWORD:-d2bc51ce4eabb6f64889036b8d260644}@postgres:5432/keyvault
      REDIS_URL: redis://redis:6379
      PORT: '5000'
    ports:
      - '6003:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.187.127.92.55.sslip.io}
    restart: unless-stopped
    ports:
      - '6001:3000'
    depends_on:
      - api

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.187.127.92.55.sslip.io}
    restart: unless-stopped
    ports:
      - '6002:3001'
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
